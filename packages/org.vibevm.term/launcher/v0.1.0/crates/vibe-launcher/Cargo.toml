[package]
name = "vibe-launcher"
description = "GUI launchers for vibevm apps (VibeTree, VibeTerm, VibeFrame) — PROP-043"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "vibetree"
path = "src/bin/vibetree.rs"

[[bin]]
name = "vibeterm"
path = "src/bin/vibeterm.rs"

[[bin]]
name = "vibeframe"
path = "src/bin/vibeframe.rs"

[dependencies]
specmark.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[target.'cfg(windows)'.build-dependencies]
embed-resource = { workspace = true }
