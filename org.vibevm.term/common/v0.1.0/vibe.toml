[package]
name = "term-common"
group = "org.vibevm.term"
kind = "tool"
version = "0.1.0"
authors = ["Oleg Chirukhin"]
license = "UPL-1.0"
description = "The shared TypeScript helpers (arg/keymap/packaging) and the normative contracts (control protocol, discovery, OSC icon swap, env markers, electron-packaging) common to every vibevm-term product (vibeterm, vibeframe, vibe-launcher). Also the home of the ported version-manager (PROP-vvm) the products self-install through"
keywords = ["vibevm", "terminal", "shared", "contracts", "version-manager"]

[compatibility]
min_vibe_version = "0.1.0"
requires_kinds = []

# Owner directive: every vibevm-term package adopts the redbook practices and
# the AI-Native Rust discipline from birth — the same adoption pattern as
# packages/org.vibevm.fractality/. redbook pins the practice edition;
# rust-ai-native pulls the -lang stack, the -mcp server, and (transitively)
# core-ai-native at one version set.
[requires.packages]
"flow:org.vibevm.world/redbook" = "^0.2.0"
"stack:org.vibevm.ai-native/rust-ai-native" = "^0.7.0"

# The boss-side integration: the boot snippet a consuming boss loads at
# session start (slot 10 — term-common is foundational, loads before the
# product packages).
[boot_snippet]
source = "spec/boot/10-tool-term-common.md"
category = "tool"

# The default registry pair every vibevm project carries. In-repo packages
# resolve from this repo's own org.vibevm.term/ directory; these two cover
# the redbook/ai-native members published only on vibespecs.
[[registry]]
name = "vibespecs"
url = "https://github.com/vibespecs"

[[registry]]
name = "vibespecs-gitverse"
url = "https://gitverse.ru/vibespecs"
naming = "name"
