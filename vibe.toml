# The workspace-level vibe manifest for the vibevm-term repo.
#
# This repo is a vibe project in its own right — the packages under
# `packages/org.vibevm.term/` consume the AI-Native Rust stack + the redbook
# practices as static-transitive deps, the same adoption pattern as
# `packages/org.vibevm.fractality/` in the host repo.
#
# The in-repo products (vibeterm, vibeframe, launcher, term-common) are
# resolved from `packages/org.vibevm.term/` via project-packages auto-
# discovery (PROP-030 §3.3): a `<project_root>/packages/` directory is opened
# as a LocalRegistry automatically, no `[[registry]]` block needed. The
# `[[registry]]` blocks below cover the redbook/ai-native members published
# only on vibespecs (GitHub/GitVerse) — those are the deps that are NOT in
# this repo.

[project]
name = "vibevm-term"
version = "0.1.0"
authors = ["Oleg Chirukhin"]

# Owner directive: every vibevm-term package adopts the redbook practices and
# the AI-Native Rust discipline from birth — this workspace and all its
# packages carry both requires (standing rule). The redbook umbrella pins the
# practice edition; the rust-ai-native aggregator pulls the -lang stack, the
# -mcp server, and (transitively) core-ai-native at one version set. This
# mirrors `packages/org.vibevm.fractality/fractality/v0.1.0/vibe.toml`.
[requires.packages]
"flow:org.vibevm.world/redbook" = "^0.2.0"
"stack:org.vibevm.ai-native/rust-ai-native" = "^0.7.0"

# The default registry pair every vibevm project carries (same blocks the
# host root and `vibe init` use). The in-repo product packages resolve from
# `packages/org.vibevm.term/` via project-packages auto-discovery
# (PROP-030 §3.3) — these two registries cover only the redbook/ai-native
# members published on vibespecs. GitHub is the canonical publish target;
# GitVerse is the resolve fall-through.
[[registry]]
name = "vibespecs"
url = "https://github.com/vibespecs"

[[registry]]
name = "vibespecs-gitverse"
url = "https://gitverse.ru/vibespecs"
naming = "name"
